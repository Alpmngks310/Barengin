chor="start">Barengin. Login dan register menjadi pintu</text><text x="794" y="204" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#29352D" text-anchor="start">masuk sebelum pengguna membuat profil.</text><line x1="794" y1="235" x2="1056" y2="235" stroke="#D8DED6" stroke-width="1"/><text x="794" y="245" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="750" fill="#78977D" text-anchor="start">KEY CONSIDERATIONS</text><text x="794" y="272" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#718075" text-anchor="start">User journey: first visit → sign in /</text><text x="794" y="288" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#718075" text-anchor="start">create account</text><text x="794" y="379" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="750" fill="#78977D" text-anchor="start">DESIGN RULES</text><circle cx="798" cy="405" r="3" fill="#78977D" stroke="none" stroke-width="1"/><text x="810" y="409" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#29352D" text-anchor="start">Primary action: sage green button</text><circle cx="798" cy="434" r="3" fill="#78977D" stroke="none" stroke-width="1"/><text x="810" y="438" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#29352D" text-anchor="start">Secondary action: white / outlined</text><circle cx="798" cy="463" r="3" fill="#78977D" stroke="none" stroke-width="1"/><text x="810" y="467" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#29352D" text-anchor="start">Cards and inputs: rounded 12–16 px</text><circle cx="798" cy="492" r="3" fill="#78977D" stroke="none" stroke-width="1"/><text x="810" y="496" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#29352D" text-anchor="start">Bottom navigation: main app screens</text><circle cx="798" cy="521" r="3" fill="#78977D" stroke="none" stroke-width="1"/><text x="810" y="525" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#29352D" text-anchor="start">Neutral surfaces keep focus on content</text><circle cx="798" cy="550" r="3" fill="#78977D" stroke="none" stroke-width="1"/><text x="810" y="554" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#29352D" text-anchor="start">Low-to-mid fidelity, not final UI</text><text x="794" y="622" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="750" fill="#78977D" text-anchor="start">FLOW / STATUS REMINDER</text><text x="794" y="648" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#718075" text-anchor="start">Activity status and join-request status</text><text x="794" y="663" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#718075" text-anchor="start">are separate fields. Example: an activity</text><text x="794" y="678" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#718075" text-anchor="start">can be Published while a request is Pending.</text><line x1="42" y1="784" x2="1080" y2="784" stroke="#D8DED6" stroke-width="1"/><text x="42" y="789" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="400" fill="#718075" text-anchor="start">Barengin · Social Activity Companion</text><text x="1080" y="789" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="400" fill="#718075" text-anchor="end">Figma-ready SVG · A4 landscape</text></svg>