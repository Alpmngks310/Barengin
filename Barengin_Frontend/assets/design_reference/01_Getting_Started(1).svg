if" font-size="8" font-weight="400" fill="#718075" text-anchor="middle">Dengan melanjutkan, kamu menyetujui Ketentuan &amp; Privasi.</text></g></g><text x="405" y="94" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#718075" text-anchor="start">02 · Login</text><g transform="translate(405,104) scale(0.79)"><rect x="-5" y="-5" width="400" height="854" rx="28" fill="#FFFFFF" stroke="#C7D0C8" stroke-width="1.5"/><defs><clipPath id="clip7412655904214420918"><rect x="0" y="0" width="390" height="844" rx="23"/></clipPath></defs><g clip-path="url(#clip7412655904214420918)"><rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F5EF" stroke="none" stroke-width="1"/><text x="20" y="21" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#29352D" text-anchor="start">9:41</text><text x="340" y="21" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#29352D" text-anchor="end">●  ▮▮  ▰</text><text x="22" y="61" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#34483B" text-anchor="start">Masuk</text><text x="24" y="104" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#34483B" text-anchor="start">Senang melihatmu lagi!</text><text x="24" y="127" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#718075" text-anchor="start">Masuk untuk menemukan aktivitas seru.</text><text x="24" y="174" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#34483B" text-anchor="start">Email</text><rect x="24" y="182" width="342" height="48" rx="10" fill="#FFFFFF" stroke="#D8DED6" stroke-width="1"/><text x="36" y="210.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#718075" text-anchor="start">nama@email.com</text><text x="24" y="251" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#34483B" text-anchor="start">Password</text><rect x="24" y="2